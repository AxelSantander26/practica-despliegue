name: Pipeline CI/CD - Despliegue Spring Boot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/practica-despliegue

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 📥 Descargar código
        uses: actions/checkout@v4

      - name: 2. ☕ Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 🔥 NUEVO PASO: Dar permisos al mvnw
      - name: 2.5. 🔧 Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: 3. 💾 Cache de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 4. 🔨 Compilar proyecto
        run: |
          echo "=============================="
          echo "📦 BUILD - Compilando proyecto"
          echo "=============================="
          ./mvnw clean compile -DskipTests
          echo "✅ BUILD EXITOSO"

      - name: 5. ✅ Ejecutar pruebas
        run: |
          echo "=============================="
          echo "🧪 TEST - Ejecutando pruebas"
          echo "=============================="
          ./mvnw test
          echo "✅ TEST EXITOSO"

      - name: 6. 📦 Empaquetar JAR
        run: |
          echo "=============================="
          echo "📦 PACKAGE - Creando JAR"
          echo "=============================="
          ./mvnw package -DskipTests
          echo "✅ JAR creado"

      - name: 7. 🔒 Control de seguridad
        run: |
          echo "=============================="
          echo "🔒 SECURITY - Analizando código"
          echo "=============================="
          if grep -RniE '(password|secret|token|api.key|credentials)[[:space:]]*=' src/main; then
            echo "❌ Posible información sensible encontrada"
            exit 1
          else
            echo "✅ SECURITY CHECK EXITOSO"
          fi

      - name: 8. 📤 Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 1. 📥 Descargar código
        uses: actions/checkout@v4

      # 🔥 NUEVO PASO: Dar permisos al mvnw también aquí
      - name: 1.5. 🔧 Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: 2. 🐳 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. 🏗️ Construir imagen Docker
        run: |
          echo "=============================="
          echo "🐳 DOCKER - Construyendo imagen"
          echo "=============================="
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          echo "✅ Imagen construida"

      - name: 4. 📤 Subir a Docker Hub
        run: |
          echo "=============================="
          echo "🐳 DOCKER - Subiendo imagen"
          echo "=============================="
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          echo "✅ Imagen publicada en Docker Hub"

  deploy-render:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 1. 🚀 Iniciar despliegue en Render
        run: |
          echo "=============================="
          echo "🚀 DEPLOY - Desplegando en Render"
          echo "=============================="
          echo "🌐 Servicio: practica-despliegue"
          echo "📦 Imagen: ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Despliegue iniciado"